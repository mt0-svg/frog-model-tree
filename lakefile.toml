name = "frog-model-tree"
version = "1.0.0"
description = "The frog model on regular trees: transience on the rooted 4-ary tree (the case d = 4 of the Hoffman-Johnson-Junge conjecture), formalized in Lean 4"
keywords = ["math", "probability", "frog model", "regular trees", "interacting random walks", "formal verification"]
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE"]
preferReleaseBuild = true
releaseRepo = "https://github.com/mt0-svg/frog-model-tree"
defaultTargets = ["Defs", "Main", "G3K", "Challenge", "Solution", "D3", "ChallengeRecurrent", "SolutionRecurrent"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

# The definitions of the statement (FrogModel/Challenge.lean without its two targets).
[[lean_lib]]
name = "Defs"
roots = ["FrogModel.Defs"]

# The development: Theorems 2.2 and 2.3 of the paper, the soundness of the checker, the targets from the data, and
# (FrogModel.LemmaX.Main) the statements of Lemmas 4.1 and 4.2 as the paper names them.
# Every module is listed, so that `lake build M` builds a single module M.
[[lean_lib]]
name = "Main"
globs = ["FrogModel.Final", "FrogModel.TheoremA", "FrogModel.Cert.+", "FrogModel.Engine.+", "FrogModel.Lanes.+",
  "FrogModel.LemmaX.+", "FrogModel.Lemmas.+", "FrogModel.LinSys.+", "FrogModel.Pieces.+", "FrogModel.Pool.+",
  "FrogModel.Recursion.+"]

# The kernel checker of the certificate, Lean core only.
[[lean_lib]]
name = "G3K"
globs = ["FrogModel.G3K.+"]

# The data of the certificate and the theorems that check it, written by code/g3k from the certificate (not committed).
[[lean_lib]]
name = "Data"
globs = ["FrogModel.G3Q.+"]

# The two statements with `sorry`, which nothing imports, and the module that proves them: the pair Comparator checks
# (config.json).
[[lean_lib]]
name = "Challenge"
roots = ["FrogModel.Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["FrogModel.Solution"]

# d = 3. The development: the reduction to the root (Lemma R, the zero-one law), the closure at the root and its
# bounds, the step map and its kernel checker, the lower model M1 and the checker of its stored run, the induction on
# the height, the certificate chain, the assembly (FrogModel.D3.Assembly).
[[lean_lib]]
name = "D3"
globs = ["FrogModel.LemmaR.+", "FrogModel.ZeroOne.+", "FrogModel.D3.Assembly", "FrogModel.D3.Bridge",
  "FrogModel.D3.ChainLaw", "FrogModel.D3.Defs", "FrogModel.D3.Interfaces.+", "FrogModel.D3.LaneA.+",
  "FrogModel.D3.LaneB.+", "FrogModel.D3.LaneC.+", "FrogModel.D3.LaneD.+", "FrogModel.D3.LaneE.+",
  "FrogModel.D3.M1L.+", "FrogModel.D3.M1K.+", "FrogModel.D3.Chain.+"]

# The data of the stored M1 run (code/m1gen) and of the certificate of Proposition 15.1 (code/d3chain), with the
# theorems that check them, written from the release assets (not committed).
[[lean_lib]]
name = "D3Data"
globs = ["FrogModel.D3.M1Data.+", "FrogModel.D3.CertData.+"]

# The statement of d = 3 with `sorry`, which nothing imports, and the module that proves it: the pair Comparator
# checks with config-recurrent.json.
[[lean_lib]]
name = "ChallengeRecurrent"
roots = ["FrogModel.ChallengeRecurrent"]

[[lean_lib]]
name = "SolutionRecurrent"
roots = ["FrogModel.SolutionRecurrent"]
