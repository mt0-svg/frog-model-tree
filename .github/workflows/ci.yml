name: CI

# The data of the certificate: the job data takes the certificate from a release or a draft of this repository
# (ASSETS.md), writes from it the Lean modules of the data and of the theorems that check it (code/g3k/gen.sh, under
# FrogModel/G3Q/, not committed), compares their sha256 with code/g3k/modules.sha256, and hands them to the Lean jobs as the
# artifact g3q. The data of d = 3: the job data3 takes the two d = 3 assets of ASSETS.md (the certificate of
# Proposition 15.1 and the stored run of the lower model M1), writes from them the Lean modules of FrogModel/D3/CertData/
# (code/d3chain/gen.sh) and FrogModel/D3/M1Data/ (code/m1gen/gen.sh), not committed, compares their sha256 with the
# modules.sha256 of each generator, and hands them to the Lean jobs as the artifact d3data.
# The Lean package: Mathlib from its cache, then the package's own modules, compiled by
# code/formal-proof/clean_build.sh in dependency order, the heavy modules a few at a time (its header lists its
# settings). The package's .lake/build is restored first, from the actions cache (the last build on this toolchain and
# manifest), else from the Lake build archive of the latest release, so only the modules that changed and those that
# import them are compiled; Comparator replays the theorems of each config (config.json, d = 4; config-recurrent.json,
# d = 3) and every declaration they depend on, in the kernel the config names (nanoda alone with lean_kernel false,
# the Lean kernel with enable_nanoda false), whatever was restored. Then the checks: every target up to date, the
# axioms of the theorems of both configs, a scan of the sources, Comparator on each config and its negative controls
# (.github/comparator-controls.tsv and .github/comparator-controls-recurrent.tsv, when present).
# The build runs as a chain of up to five jobs. Each one continues the build of the previous one (handed over
# as the artifact lake-build) for at most 300 minutes, under the 6 hour limit of a job, and the chain stops at
# the first job that ends it. The last job fails if the build is still not complete.
#
# The computations: the job data above, which also reruns code/gp/start_values.gp on the certificate, and the job gp,
# which reruns the PARI/GP scripts small_checks.gp and table_tex.gp of code/gp and compares
# their outputs with code/gp/small_checks.out and paper/table.tex, and reruns code/table/run_table.sh, which writes the
# table from its two iterates, and compares it with code/certificate/table.cert; and the job writers3, which reruns the
# writers of the d = 3 data (code/m1run, code/d3cert, code/dcheck), which the proof does not trust, and compares what
# they write with the files that the Lean jobs read: the stored run of M1 and the masses with the inputs of
# code/m1gen/modules.sha256, the certificate with those of code/d3chain/modules.sha256, the table of Proposition 15.2
# with FrogModel/D3/LaneE/Table.lean.
# Every job uploads the complete output of each check and one result line per check as an artifact verify-*, which
# release.yml collects into the verification archive of a release. A run started by hand on the default branch ends
# with the job badges, which writes the three badges of the README to the branch badges, with the page run.html that
# their links open, which forwards to this run.
# Only commits that touch the build or the computations run it, and never a push to main, whose commit the run started
# by hand certifies; a newer push cancels the older run on the same branch.
# On a push to an existing branch the job changes reads the files of the pushed commits, and only the jobs of the parts
# they touch run: the jobs gp and writers3 for code/gp, code/table, code/certificate/table.cert, paper/table.tex,
# rust-toolchain.toml, code/m1run, code/d3cert, code/dcheck, the two modules.sha256 of code/m1gen and code/d3chain and
# FrogModel/D3/LaneE/Table.lean; the jobs data and data3 and the Lean
# jobs for the Lean sources, the Lake files, config.json, config-recurrent.json, ASSETS.md, code/g3k/, code/m1gen/,
# code/d3chain/, code/gp/start_values.* and code/formal-proof/. A change of this file, a run by hand, a pull request and a new branch run everything. A release
# takes a run started by hand on its tagged commit (release.yml).
on:
  push:
    branches-ignore: [main]
    paths: &build-paths
      - "**.lean"
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - rust-toolchain.toml
      - config.json
      - config-recurrent.json
      - ASSETS.md
      - paper/table.tex
      - .github/scripts/fetch-assets.sh
      - code/**
      - .github/comparator-controls.tsv
      - .github/comparator-controls-recurrent.tsv
      - .github/comparator-lean-kernel.patch
      - .github/workflows/ci.yml
  pull_request:
    paths: *build-paths
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ROOT: FrogModel
  PACKAGE: frog-model-tree
  # The default targets of lakefile.toml: d = 4 (Defs to Solution), d = 3 (D3 to SolutionRecurrent).
  TARGETS: Defs Main G3K Challenge Solution D3 ChallengeRecurrent SolutionRecurrent

jobs:
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      compute: ${{ steps.diff.outputs.compute }}
      lean: ${{ steps.diff.outputs.lean }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Files of the pushed commits
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" != push ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "$zero" ] ||
            ! files=$(git diff --name-only --no-renames "$BEFORE" "$SHA"); then
            echo "$EVENT${BEFORE:+ from $BEFORE}: every job runs"
            { echo compute=true; echo lean=true; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          compute=false lean=false
          while IFS= read -r f; do
            case "$f" in .github/workflows/ci.yml) compute=true lean=true ;; esac
            case "$f" in code/gp/* | code/table/* | code/certificate/table.cert | paper/table.tex | rust-toolchain.toml | code/m1run/* | code/d3cert/* | code/dcheck/* | code/m1gen/modules.sha256 | code/d3chain/modules.sha256 | FrogModel/D3/LaneE/Table.lean) compute=true ;; esac
            case "$f" in *.lean | lakefile.toml | lake-manifest.json | lean-toolchain | config.json | config-recurrent.json | ASSETS.md | code/g3k/* | code/m1gen/* | code/d3chain/* | code/gp/start_values.* | code/formal-proof/* | .github/comparator-* | .github/scripts/fetch-assets.sh) lean=true ;; esac
          done <<< "$files"
          printf '%s\n' "$files"
          echo "compute=$compute lean=$lean"
          { echo "compute=$compute"; echo "lean=$lean"; } >> "$GITHUB_OUTPUT"

  scan:
    name: Source scan
    needs: [changes, data, data3]
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: g3q
          path: FrogModel/G3Q
      - uses: actions/download-artifact@v4
        with:
          name: d3data
          path: FrogModel/D3
      - name: sorry, admit and native_decide outside comments and strings
        shell: bash
        run: |
          set -u
          mkdir -p verify/lean verify/results
          cat > scan.awk <<'EOF'
          FNR == 1 { depth = 0 }
          {
            s = $0; out = ""; i = 1; n = length(s)
            while (i <= n) {
              two = substr(s, i, 2)
              if (depth > 0) {
                if (two == "/-") { depth++; i += 2 } else if (two == "-/") { depth--; i += 2 } else i++
                continue
              }
              if (two == "/-") { depth = 1; i += 2; continue }
              if (two == "--") break
              c = substr(s, i, 1)
              if (c == "\"") {
                j = i + 1
                while (j <= n) { d = substr(s, j, 1); if (d == "\\") { j += 2; continue }; if (d == "\"") break; j++ }
                out = out " "; i = j + 1; continue
              }
              out = out c; i++
            }
            if (match(out, "(^|[^A-Za-z0-9_.'!?])(" W ")([^A-Za-z0-9_'!?]|$)")) print FILENAME ":" FNR ": " $0
          }
          EOF
          data="$ROOT/G3Q $ROOT/D3/M1Data $ROOT/D3/CertData"
          { find "$ROOT" -name '*.lean' ! -path "$ROOT/Challenge.lean" ! -path "$ROOT/ChallengeRecurrent.lean" ! -path "$ROOT/G3Q/*" \
              ! -path "$ROOT/D3/M1Data/*" ! -path "$ROOT/D3/CertData/*"; [ ! -f "$ROOT.lean" ] || echo "$ROOT.lean"; } | LC_ALL=C sort > files.txt
          # shellcheck disable=SC2086 # data is a list of directories
          {
            echo "# Uses of sorry, admit and native_decide outside comments and string literals, in the $(wc -l < files.txt) files of $ROOT/ other than Challenge.lean, ChallengeRecurrent.lean and the data modules, of admit and native_decide in Challenge.lean and ChallengeRecurrent.lean (whose statements end in sorry), and of the three words anywhere, comments included, in the $(find $data -name '*.lean' | wc -l) data modules of $ROOT/G3Q/ (written by the job data), $ROOT/D3/M1Data/ and $ROOT/D3/CertData/ (written by the job data3)."
            xargs awk -v W='sorry|admit|native_decide' -f scan.awk < files.txt
            awk -v W='admit|native_decide' -f scan.awk "$ROOT/Challenge.lean" "$ROOT/ChallengeRecurrent.lean"
            grep -rnwE --include='*.lean' 'sorry|admit|native_decide' $data || true
          } > scan.txt
          cat scan.txt
          hits=$(($(wc -l < scan.txt) - 1))
          echo "# $hits uses" >> scan.txt
          cp scan.txt verify/lean/source-scan.txt
          if [ "$hits" -eq 0 ]; then r=PASS; else r=FAIL; fi
          printf 'source-scan\tscan of %s/ for sorry, admit and native_decide outside comments\t%s uses\t%s\tlean/source-scan.txt\n' "$ROOT" "$hits" "$r" > verify/results/source-scan.tsv
          [ "$r" = PASS ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-source-scan
          path: verify/

  data:
    name: Data modules
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-24.04  # pari-gp 2.15.4, under which the scripts give the recorded outputs
    timeout-minutes: 60
    permissions:
      contents: write # a draft release is visible only with write access; this job writes nothing
    steps:
      - uses: actions/checkout@v5
      - name: The certificate from a release, checked against ASSETS.md
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-assets.sh "$RUNNER_TEMP/assets" frog-model-tree-certificate.v4.zst
      - name: Set up Lean
        if: steps.fetch.outputs.release != ''
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: code/g3k
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: The modules of the data, written by g3k and compared with code/g3k/modules.sha256
        shell: bash
        run: |
          set -uo pipefail
          [ -n "${{ steps.fetch.outputs.release }}" ] || { echo "No release has the certificate of ASSETS.md: the Lean modules of its data cannot be written."; exit 1; }
          mkdir -p verify/data verify/results verify/versions
          s0=$(date +%s)
          zstd -qdc "$RUNNER_TEMP/assets/frog-model-tree-certificate.v4.zst" > "$RUNNER_TEMP/certificate.v4"
          rc=0
          code/g3k/gen.sh "$RUNNER_TEMP/certificate.v4" verify/data 2>&1 | tee verify/data/gen-run.txt || rc=$?
          lean --version > verify/versions/lean.txt
          if [ "$rc" -eq 0 ]; then r=PASS; else r=FAIL; fi
          printf 'data\tcode/g3k/gen.sh on the certificate of release %s\t%s modules, %s s\t%s\tdata/modules.out\n' \
            "${{ steps.fetch.outputs.release }}" "$(wc -l < verify/data/modules.out 2> /dev/null || echo 0)" "$(($(date +%s) - s0))" "$r" > verify/results/data.tsv
          # The values of the certificate at the start state, against code/gp/start_values.out.
          sudo apt-get update -qq && sudo apt-get install -y -qq pari-gp
          echo 'print("PARI/GP ", version())' | gp -q > verify/versions/gp.txt
          [ "$(cat verify/versions/gp.txt)" = "PARI/GP [2, 15, 4]" ] || { echo "PARI/GP is not 2.15.4, the version under which the scripts give the recorded outputs"; exit 1; }
          (cd code/gp && CERT="$RUNNER_TEMP/certificate.v4" gp -q -D colors=no start_values.gp < /dev/null) > verify/data/start_values.txt 2>&1 || true
          if diff code/gp/start_values.out verify/data/start_values.txt; then r2=PASS; else r2=FAIL; fi
          printf 'gp start_values\tgp -q start_values.gp (in code/gp) on the certificate, compared with code/gp/start_values.out\t-\t%s\tdata/start_values.txt\n' "$r2" > verify/results/gp_start_values.tsv
          [ "$r" = PASS ] && [ "$r2" = PASS ]
      - uses: actions/upload-artifact@v4
        with:
          name: g3q
          path: FrogModel/G3Q
          compression-level: 6
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-data
          path: verify/

  data3:
    name: Data modules, d = 3
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # a draft release is visible only with write access; this job writes nothing
    steps:
      - uses: actions/checkout@v5
      - name: The d = 3 certificate and the stored M1 run from a release, checked against ASSETS.md
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-assets.sh "$RUNNER_TEMP/assets" frog-model-tree-d3-certificate.tar.zst frog-model-tree-d3-m1run.txt.xz
      - name: Set up Lean
        if: steps.fetch.outputs.release != ''
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: code/d3chain
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      # The two generators are Lean programs without Mathlib; the kernel checks of the data are in the modules they
      # write, which the Lean build compiles.
      - name: The modules of the data, written by m1gen and d3chain and compared with their modules.sha256
        shell: bash
        run: |
          set -uo pipefail
          [ -n "${{ steps.fetch.outputs.release }}" ] || { echo "No release has the d = 3 assets of ASSETS.md: the Lean modules of their data cannot be written."; exit 1; }
          mkdir -p verify/data3 verify/results verify/versions
          a=$RUNNER_TEMP/assets
          lean --version > verify/versions/lean.txt
          s0=$(date +%s); rc=0
          code/m1gen/gen.sh "$a/frog-model-tree-d3-m1run.txt.xz" "$a/d3-certificate/masses100.txt" verify/data3/m1gen 2>&1 \
            | tee verify/data3/m1gen-run.txt || rc=$?
          if [ "$rc" -eq 0 ]; then r=PASS; else r=FAIL; fi
          printf 'data3 m1gen\tcode/m1gen/gen.sh on the stored M1 run of release %s\t%s modules, %s s\t%s\tdata3/m1gen/modules.out\n' \
            "${{ steps.fetch.outputs.release }}" "$(wc -l < verify/data3/m1gen/modules.out 2> /dev/null || echo 0)" "$(($(date +%s) - s0))" "$r" > verify/results/data3.tsv
          s0=$(date +%s); rc=0
          JOBS=4 code/d3chain/gen.sh "$a/d3-certificate" verify/data3/d3chain 2>&1 | tee verify/data3/d3chain-run.txt || rc=$?
          if [ "$rc" -eq 0 ]; then r2=PASS; else r2=FAIL; fi
          printf 'data3 d3chain\tcode/d3chain/gen.sh on the certificate of Proposition 15.1 of release %s\t%s modules, %s s\t%s\tdata3/d3chain/modules.out\n' \
            "${{ steps.fetch.outputs.release }}" "$(wc -l < verify/data3/d3chain/modules.out 2> /dev/null || echo 0)" "$(($(date +%s) - s0))" "$r2" >> verify/results/data3.tsv
          [ "$r" = PASS ] && [ "$r2" = PASS ]
      - uses: actions/upload-artifact@v4
        with:
          name: d3data
          path: |
            FrogModel/D3/M1Data
            FrogModel/D3/CertData
          compression-level: 6
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-data3
          path: verify/

  build-1:
    name: Lean build, part 1
    needs: [changes, data, data3]
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PART: "1"
      LAST: "false"
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps: &build-steps
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v5
      - name: The data modules of the job data
        uses: actions/download-artifact@v4
        with:
          name: g3q
          path: FrogModel/G3Q
      - name: The data modules of the job data3
        uses: actions/download-artifact@v4
        with:
          name: d3data
          path: FrogModel/D3
      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Build of the previous part
        if: env.PART != '1'
        uses: actions/download-artifact@v4
        with:
          name: lake-build
          path: .lake/build
      - name: Earlier build from the cache
        id: cache
        if: env.PART == '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Earlier build from the latest release
        if: env.PART == '1' && steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          a=$PACKAGE-x86_64-unknown-linux-gnu.tar.gz
          if gh release download --pattern "$a" -D /tmp 2> /dev/null; then
            mkdir -p .lake/build && tar -xzf "/tmp/$a" -C .lake/build && rm "/tmp/$a"
            echo "Restored the build of the latest release."
          else
            echo "No release build archive: a build from scratch."
          fi
      - name: Build
        id: build
        shell: bash
        run: |
          set -u
          # Each part writes its own clean_build.out and clean_build_modules.txt; parts 2 to 5 continue (RESUME=1)
          # on the build handed over by the previous part.
          rm -f code/formal-proof/clean_build.out code/formal-proof/clean_build_modules.txt
          # Part 1 starts from scratch unless an earlier build was restored; the traces decide what is rebuilt.
          if [ "$PART" = 1 ] && [ ! -d .lake/build/lib ]; then resume=0; else resume=1; fi
          rc=0
          # A restored build that is already up to date needs no pass of clean_build.sh (one lake call per few modules).
          # shellcheck disable=SC2086 # TARGETS is a list of targets
          if [ "$resume" = 1 ] && lake build --no-build $TARGETS > /dev/null 2>&1; then
            echo "# result: ok, the restored build is up to date (lake build --no-build)" | tee code/formal-proof/clean_build.out
            : > code/formal-proof/clean_build_modules.txt
          else
          timeout -k 2m 300m env RUN_WRAP= HB=1 LB=2 PEAK_HEAVY=9G PEAK_LIGHT=4G MEM_MARGIN=1G MIN_DISK_GB=3 RESUME=$resume \
            code/formal-proof/clean_build.sh || rc=$?
          fi
          mkdir -p "verify/build/part-$PART" verify/results
          cp code/formal-proof/clean_build.out code/formal-proof/clean_build_modules.txt "verify/build/part-$PART/" || true
          last=$(tail -1 code/formal-proof/clean_build.out 2> /dev/null || true)
          if [ "$rc" -eq 0 ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            printf 'build\tcode/formal-proof/clean_build.sh, parts 1 to %s\t%s\tPASS\tbuild/\n' "$PART" "$last" > verify/results/build.tsv
          elif [ "$rc" -eq 124 ] && [ "$LAST" != true ]; then
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "Part $PART stopped at its time limit; the next part continues the build."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "Build failed (exit $rc): $last"
            exit 1
          fi
      - name: Save the build to the cache
        if: always() && steps.build.outputs.done == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: lake-build
          path: .lake/build
          include-hidden-files: true
          overwrite: true
          compression-level: 1
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-build-part-${{ env.PART }}
          path: verify/

  build-2:
    name: Lean build, part 2
    needs: build-1
    if: needs.build-1.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PART: "2"
      LAST: "false"
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps: *build-steps

  build-3:
    name: Lean build, part 3
    needs: build-2
    if: needs.build-2.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PART: "3"
      LAST: "false"
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps: *build-steps

  build-4:
    name: Lean build, part 4
    needs: build-3
    if: needs.build-3.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PART: "4"
      LAST: "false"
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps: *build-steps

  build-5:
    name: Lean build, part 5
    needs: build-4
    if: needs.build-4.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PART: "5"
      LAST: "true"
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps: *build-steps

  lean:
    name: Lean checks
    needs: [changes, build-1, build-2, build-3, build-4, build-5]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.lean == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      built: ${{ steps.up-to-date.outputs.built }}
      hypotheses: ${{ steps.facts.outputs.hypotheses }}
      axioms: ${{ steps.facts.outputs.axioms }}
      sorryAx: ${{ steps.facts.outputs.sorryAx }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v5
      - name: The data modules of the job data
        uses: actions/download-artifact@v4
        with:
          name: g3q
          path: FrogModel/G3Q
      - name: The data modules of the job data3
        uses: actions/download-artifact@v4
        with:
          name: d3data
          path: FrogModel/D3
      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: lake-build
          path: .lake/build
      - name: Every target up to date, no sorry warning outside Challenge.lean and ChallengeRecurrent.lean, no other message in the d = 3 modules
        id: up-to-date
        shell: bash
        run: |
          set -u
          mkdir -p verify/lean verify/results verify/versions
          rc=0
          # shellcheck disable=SC2086 # TARGETS is a list of targets
          lake build --no-build $TARGETS > up-to-date.txt 2>&1 || rc=$?
          cat up-to-date.txt
          cp up-to-date.txt verify/lean/up-to-date.txt
          n=$(grep -E "declaration uses [\`']sorry[\`']" up-to-date.txt | grep -v "$ROOT/Challenge.lean" | grep -vc "$ROOT/ChallengeRecurrent.lean" || true)
          # The other messages, the sorry of the two challenges aside: none in the d = 3 modules (D3, LemmaR, ZeroOne,
          # ChallengeRecurrent.lean, SolutionRecurrent.lean); those of the d = 4 modules (as in v1) are counted.
          d3="$ROOT/((D3|LemmaR|ZeroOne)/|(ChallengeRecurrent|SolutionRecurrent)\.lean:)"
          grep -E "^(warning|info): $ROOT/" up-to-date.txt |
            grep -vE "^warning: $ROOT/(Challenge|ChallengeRecurrent)\.lean:[0-9]+:[0-9]+: declaration uses [\`']sorry[\`']$" > messages.txt || true
          cp messages.txt verify/lean/messages.txt
          m3=$(grep -cE "^(warning|info): $d3" messages.txt || true)
          m4=$(grep -vcE "^(warning|info): $d3" messages.txt || true)
          if [ "$rc" -eq 0 ] && [ "$n" -eq 0 ] && [ "$m3" -eq 0 ]; then r=PASS; else r=FAIL; fi
          printf 'up-to-date\tlake build --no-build %s\t%s sorry warnings outside Challenge.lean and ChallengeRecurrent.lean; other warnings and infos: %s in the d = 3 modules, %s in the d = 4 modules\t%s\tlean/up-to-date.txt\n' "$TARGETS" "$n" "$m3" "$m4" "$r" > verify/results/up-to-date.tsv
          [ "$rc" -ne 0 ] || echo "built=true" >> "$GITHUB_OUTPUT"
          [ "$r" = PASS ]
      - name: '#print axioms'
        shell: bash
        run: |
          set -u
          rc=0
          lake env lean code/formal-proof/main_axioms.lean > axioms.txt 2>&1 || rc=$?
          cat axioms.txt
          cp axioms.txt verify/lean/axioms.txt
          lean --version > verify/versions/lean.txt
          r=PASS
          [ "$rc" -eq 0 ] || r=FAIL
          for t in $(jq -r '.theorem_names[]' config.json config-recurrent.json); do
            grep -q "^'$t' depends on axioms: \[" axioms.txt || { echo "no axioms line for $t"; r=FAIL; }
          done
          other=$(sed -n "s/^'[^']*' depends on axioms: \[\(.*\)\]$/\1/p" axioms.txt | tr ',' '\n' | tr -d ' ' \
            | grep -vxE 'propext|Classical\.choice|Quot\.sound' | sort -u | tr '\n' ' ' || true)
          [ -z "$other" ] || { echo "axioms outside propext, Classical.choice, Quot.sound: $other"; r=FAIL; }
          printf 'axioms\tlake env lean code/formal-proof/main_axioms.lean\t%s theorems\t%s\tlean/axioms.txt\n' \
            "$(grep -c 'depends on axioms' axioms.txt)" "$r" > verify/results/axioms.tsv
          [ "$r" = PASS ]
      # The negative controls of the d = 3 data (code/d3chain/neg): each states one kernel check of the chain on a
      # falsified datum (a line with its output deficit lowered, the final comparison with a row of T lowered by one
      # unit) and must fail with the kernel rejecting the `decide`.
      - name: Negative controls of the d = 3 data
        shell: bash
        run: |
          set -u
          r=PASS n=0
          : > neg-d3.txt
          for f in code/d3chain/neg/Neg*.lean; do
            n=$((n + 1)) rc=0
            log=$(lake env lean "$f" 2>&1) || rc=$?
            if [ "$rc" -ne 0 ] && grep -qF '(kernel) application type mismatch' <<< "$log" && grep -q decide <<< "$log"; then
              v="fails as expected"
            else v=UNEXPECTED r=FAIL; fi
            printf '%s  rc %s  %s\n' "$f" "$rc" "$v" >> neg-d3.txt
            printf '%s\n' "$log" | head -8 >> neg-d3.txt
          done
          cat neg-d3.txt
          cp neg-d3.txt verify/lean/neg-d3.txt
          [ "$n" -ge 2 ] || r=FAIL
          printf 'neg-d3\tlake env lean code/d3chain/neg/Neg*.lean\t%s controls, each rejected by the kernel\t%s\tlean/neg-d3.txt\n' \
            "$n" "$r" > verify/results/neg-d3.tsv
          [ "$r" = PASS ]
      # For the badges: the hypotheses of the theorems of config.json and config-recurrent.json and their axioms.
      - name: code/formal-proof/facts.lean
        id: facts
        shell: bash
        run: |
          set -eu
          lake env lean code/formal-proof/facts.lean | tee facts.txt
          awk '$1 == "hypotheses" || $1 == "axioms" || $1 == "sorryAx" { print $1 "=" $2 }' facts.txt >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-lean
          path: verify/

  # One job per config: config.json (d = 4) and config-recurrent.json (d = 3), each with its negative controls
  # (.github/comparator-controls.tsv, .github/comparator-controls-recurrent.tsv) and its result files (suffix).
  comparator:
    name: Comparator (${{ matrix.config }})
    needs: [changes, lean]
    if: ${{ !cancelled() && needs.changes.outputs.lean == 'true' && needs.lean.outputs.built == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: config.json
            suffix: ""
          - config: config-recurrent.json
            suffix: "-recurrent"
    env:
      CONFIG: ${{ matrix.config }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v5
      - name: The data modules of the job data
        uses: actions/download-artifact@v4
        with:
          name: g3q
          path: FrogModel/G3Q
      - name: The data modules of the job data3
        uses: actions/download-artifact@v4
        with:
          name: d3data
          path: FrogModel/D3

      - uses: actions/checkout@v5
        with:
          repository: leanprover/comparator
          ref: d03acab154d269c06e60e4de7e4cc85deebff94b
          path: .ci/comparator

      - uses: actions/checkout@v5
        with:
          repository: Zouuup/landrun
          ref: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          path: .ci/landrun

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build Landrun
        working-directory: .ci/landrun
        run: go build -o landrun cmd/landrun/main.go

      - name: Build nanoda
        run: cargo install --locked --git https://github.com/ammkrn/nanoda_lib --rev 3a2407216ee84a75f9e1aead6803d0578be06ae7 --root "$RUNNER_TEMP/nanoda"

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: lake-build
          path: .lake/build
      # Comparator trusts the challenge module, so it is compiled again from its source inside the sandbox.
      - name: Drop the build outputs of the challenge module
        run: |
          c=$(jq -r .challenge_module "$CONFIG" | tr . /)
          echo "CHALLENGE=$c" >> "$GITHUB_ENV"
          rm -rfv ".lake/build/lib/lean/$c" .lake/build/lib/lean/"$c".* ".lake/build/ir/$c" .lake/build/ir/"$c".*

      # The option lean_kernel of the config (false: nanoda alone replays the export, the build having run the Lean
      # kernel on every declaration), a patch of this repository on Comparator (.github/comparator-lean-kernel.patch).
      - name: Patch Comparator
        run: git -C .ci/comparator apply "$GITHUB_WORKSPACE/.github/comparator-lean-kernel.patch"

      # Comparator at this commit targets Lean v4.34.0; build it with the project's toolchain so that
      # lean4export reads the project's .olean files.
      - name: Align the Comparator toolchain
        run: cp lean-toolchain .ci/comparator/lean-toolchain

      - name: Build Comparator
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .ci/comparator
          auto-config: false
          build: true
          build-args: lean4export comparator
          use-mathlib-cache: false
          use-github-cache: false

      - name: Check lean4export commit
        run: test "$(git -C .ci/comparator/.lake/packages/lean4export rev-parse HEAD)" = 076e8e57707e813375e8f9da8bf989799ace9680

      - name: Start time
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      # $CONFIG: the theorems of the solution module against the statements of the challenge module, the permitted
      # axioms, then nanoda (enable_nanoda; 4 threads, set by Comparator), and the Lean kernel unless lean_kernel is false.
      - name: Run Comparator
        id: run
        shell: bash
        env:
          COMPARATOR_LANDRUN: ${{ github.workspace }}/.ci/landrun/landrun
          COMPARATOR_LEAN4EXPORT: ${{ github.workspace }}/.ci/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export
          COMPARATOR_NANODA: ${{ runner.temp }}/nanoda/bin/nanoda_bin
        # One more run, and only one, when lean4export crashed (exit 139) during the export, before any kernel ran;
        # that run decides. Any other failure is final.
        run: |
          run() {
            systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pty --pipe \
              -E PATH="$PATH" \
              -E COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
              -E COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
              -E COMPARATOR_NANODA="$COMPARATOR_NANODA" \
              --working-directory "$PWD" -- \
              bash -c "lake env .ci/comparator/.lake/build/bin/comparator $CONFIG" \
              2>&1 | tee "$1"
          }
          export_crash() {
            awk '{ sub(/\r$/, "") }
              /^Exporting #\[/ { exported = 1 }
              exported && /^uncaught exception: Child exited with 139$/ { crashed = 1 }
              /kernel on solution|kernel accepts the solution|kernel rejects the solution/ { kernel = 1 }
              END { exit !(crashed && !kernel) }' "$1"
          }
          rc=0
          run "comparator$SUFFIX.log" || rc=$?
          retry=no
          if [ "$rc" != 0 ] && export_crash "comparator$SUFFIX.log"; then
            retry=yes
            echo "lean4export exited with 139 during the export, before any kernel: Comparator runs once more"
            rc=0
            run "comparator$SUFFIX-retry.log" || rc=$?
          fi
          echo "retry=$retry" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # The negative controls of .github/comparator-controls$SUFFIX.tsv, when the repository has one, after a pass: each
      # changes one line of the challenge in place, and Comparator must reject it with the expected message (at the
      # comparison, before any kernel); the file is restored after each control.
      - name: Negative controls
        id: controls
        if: steps.run.outcome == 'success' && hashFiles(format('.github/comparator-controls{0}.tsv', matrix.suffix)) != ''
        shell: bash
        env:
          COMPARATOR_LANDRUN: ${{ github.workspace }}/.ci/landrun/landrun
          COMPARATOR_LEAN4EXPORT: ${{ github.workspace }}/.ci/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export
          COMPARATOR_NANODA: ${{ runner.temp }}/nanoda/bin/nanoda_bin
        run: |
          set -uo pipefail
          mkdir -p verify/lean
          : > controls.tsv
          fail=0
          while IFS=$'\t' read -r name file old new expect; do
            case $name in '#'* | '') continue ;; esac
            s0=$(date +%s); rc=none
            log=verify/lean/comparator$SUFFIX-$name.txt
            n=$(grep -cxF -- "$old" "$file" || true)
            if [ "$n" = 1 ]; then
              cp "$file" "$RUNNER_TEMP/original"
              awk -v o="$old" -v n="$new" '$0 == o { print n; next } { print }' "$RUNNER_TEMP/original" > "$file"
              rm -rf ".lake/build/lib/lean/$CHALLENGE" .lake/build/lib/lean/"$CHALLENGE".* \
                ".lake/build/ir/$CHALLENGE" .lake/build/ir/"$CHALLENGE".*
              { echo "control $name: in $file only, the line"; echo "  $old"; echo "is changed to"; echo "  $new"
                echo "lines that differ from the original: $(diff "$RUNNER_TEMP/original" "$file" | grep -c '^>')"
              } > "$log"
              rc=0
              systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pty --pipe \
                -E PATH="$PATH" \
                -E COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
                -E COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
                -E COMPARATOR_NANODA="$COMPARATOR_NANODA" \
                --working-directory "$PWD" -- \
                bash -c "lake env .ci/comparator/.lake/build/bin/comparator $CONFIG" \
                2>&1 | tee -a "$log" || rc=$?
              cp "$RUNNER_TEMP/original" "$file"
              if [ "$rc" != 0 ] && tr -d '\r' < "$log" | grep -qF -- "$expect"; then r=PASS; else r=FAIL; fi
            else
              echo "control $name: the line to change is found $n times in $file" > "$log"; r=FAIL
            fi
            echo "control $name: $r (exit $rc, expected a rejection with: $expect)" | tee -a "$log"
            printf 'comparator%s-%s\tcomparator %s, %s changed in one line (negative control)\t%s s\t%s\t%s\n' \
              "$SUFFIX" "$name" "$CONFIG" "$file" "$(($(date +%s) - s0))" "$r" "lean/comparator$SUFFIX-$name.txt" >> controls.tsv
            [ "$r" = PASS ] || fail=1
          done < ".github/comparator-controls$SUFFIX.tsv"
          exit "$fail"

      - name: Record the result
        if: always()
        shell: bash
        run: |
          mkdir -p verify/lean verify/results
          secs=$(($(date +%s) - ${START:-$(date +%s)}))
          cp "comparator$SUFFIX.log" "verify/lean/comparator$SUFFIX.txt" || true
          files=lean/comparator$SUFFIX.txt; retry="no retry"
          if [ "${{ steps.run.outputs.retry }}" = yes ]; then
            cp "comparator$SUFFIX-retry.log" "verify/lean/comparator$SUFFIX-retry.txt" || true
            files="lean/comparator$SUFFIX.txt lean/comparator$SUFFIX-retry.txt"; retry="retried once after a lean4export crash"
          fi
          k=$(jq -r '[.enable_nanoda // false, .lean_kernel != false] | map(tostring) | join(" ")' "$CONFIG")
          case $k in "true true") kernels="nanoda and the Lean kernel" ;; "true false") kernels=nanoda ;; *) kernels="Lean kernel" ;; esac
          if [ "${{ steps.run.outcome }}" = success ]; then r=PASS; else r=FAIL; fi
          printf 'comparator%s\tcomparator %s (%s against %s, %s; %s)\t%s s\t%s\t%s\n' "$SUFFIX" "$CONFIG" \
            "$(jq -r .challenge_module "$CONFIG")" "$(jq -r .solution_module "$CONFIG")" "$kernels" "$retry" \
            "$secs" "$r" "$files" > "verify/results/comparator$SUFFIX.tsv"
          if [ -f controls.tsv ]; then cat controls.tsv >> "verify/results/comparator$SUFFIX.tsv"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-comparator${{ matrix.suffix }}
          path: verify/

  gp:
    name: Constants and table (PARI/GP, Rust)
    needs: changes
    if: needs.changes.outputs.compute == 'true'
    runs-on: ubuntu-24.04  # pari-gp 2.15.4, under which the scripts give the recorded outputs
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq pari-gp
      - name: PARI/GP 2.15.4 and Rust 1.98.1 (rust-toolchain.toml)
        run: |
          [ "$(echo 'print(version())' | gp -q)" = "[2, 15, 4]" ] || { echo "PARI/GP is not 2.15.4"; exit 1; }
          rustup toolchain install 1.98.1 --profile minimal
      - name: code/gp/small_checks.gp and code/gp/table_tex.gp, compared with code/gp/small_checks.out and paper/table.tex; code/table/run_table.sh
        shell: bash
        run: |
          set -u
          mkdir -p verify/gp verify/results verify/versions
          echo 'print("PARI/GP ", version())' | gp -q > verify/versions/gp.txt
          ok=1
          for c in "small_checks code/gp/small_checks.out" "table_tex paper/table.tex"; do
            set -- $c; s=$(date +%s)
            (cd code/gp && gp -q -D colors=no "$1.gp" < /dev/null) > "verify/gp/$1.txt" 2>&1 || true
            if diff "$2" "verify/gp/$1.txt"; then r=PASS; else r=FAIL; ok=0; fi
            printf 'gp %s\tgp -q %s.gp (in code/gp), compared with %s\t%s s\t%s\tgp/%s.txt\n' "$1" "$1" "$2" $(($(date +%s) - s)) "$r" "$1" > "verify/results/gp_$1.tsv"
          done
          rustc --version > verify/versions/rust.txt
          s=$(date +%s)
          code/table/run_table.sh > verify/gp/table.txt 2>&1 || true
          if [ "$(tail -n 1 verify/gp/table.txt)" = "out/table.v3 equals ../certificate/table.cert" ]; then r=PASS; else r=FAIL; ok=0; fi
          printf 'table\tcode/table/run_table.sh, the table from its two iterates, compared with code/certificate/table.cert\t%s s\t%s\tgp/table.txt\n' $(($(date +%s) - s)) "$r" > verify/results/table.tsv
          cat verify/results/*.tsv
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-gp
          path: verify/

  # The writers of the d = 3 data, which the proof does not trust: each run.sh writes its data again and compares it
  # with what the Lean jobs read (code/README.md), and its output with the recorded one.
  writers3:
    name: Writers of the d = 3 data (Rust, PARI/GP)
    needs: changes
    if: needs.changes.outputs.compute == 'true'
    runs-on: ubuntu-24.04  # pari-gp 2.15.4, under which the scripts give the recorded outputs
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq pari-gp
      - name: PARI/GP 2.15.4 and Rust 1.98.1 (rust-toolchain.toml)
        run: |
          [ "$(echo 'print(version())' | gp -q)" = "[2, 15, 4]" ] || { echo "PARI/GP is not 2.15.4"; exit 1; }
          rustup toolchain install 1.98.1 --profile minimal
      - name: code/m1run/run.sh, code/d3cert/run.sh (from the masses that m1run writes) and code/dcheck/run.sh
        shell: bash
        run: |
          set -u
          mkdir -p verify/writers3 verify/results
          ok=1
          for c in "m1run the stored run of M1 and the masses, compared with the inputs of code/m1gen/modules.sha256" \
            "d3cert the certificate of Proposition 15.1 from these masses, compared with the inputs of code/d3chain/modules.sha256" \
            "dcheck the table of Proposition 15.2: dcheck_m1_cert.gp, dcheck_m1.out and FrogModel/D3/LaneE/Table.lean written again and compared"; do
            w=${c%% *} s=$(date +%s)
            # PASS when run.sh compares equal and writes the recorded output code/$w/out/run.out again, byte for byte.
            if "code/$w/run.sh" > "verify/writers3/$w.txt" 2>&1 && git diff --exit-code -- "code/$w/out/run.out" >> "verify/writers3/$w.txt" 2>&1; then
              r=PASS
            else r=FAIL; ok=0; fi
            printf 'writer %s\tcode/%s/run.sh, %s\t%s s\t%s\twriters3/%s.txt\n' "$w" "$w" "${c#* }" $(($(date +%s) - s)) "$r" "$w" > "verify/results/writer_$w.tsv"
          done
          cat verify/results/*.tsv
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-writers3
          path: verify/

  # The three badges of the README, from a run started by hand on the default branch: shields.io endpoint files on the
  # branch badges, and run.html, which sends the links of the README to this run (GitHub Pages serves the branch).
  badges:
    name: Badges
    needs: [changes, scan, data, data3, build-1, build-2, build-3, build-4, build-5, lean, comparator, gp, writers3]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Badge files
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          # Every job of the run whose name this does not match is a computation job (one per matrix entry).
          NOT_COMPUTATION: '^(Changed parts|Source scan|Lean .*|Paper .*|Comparator( .*)?|Badges)$'
        shell: bash
        run: |
          set -eu
          mkdir out
          result() { jq -r --arg j "$1" '.[$j].result' <<< "$NEEDS"; }
          fact() { jq -r --arg j "$1" --arg k "$2" '.[$j].outputs[$k] // ""' <<< "$NEEDS"; }
          # The Lean logo of vscode-lean4 at a pinned commit, without its editor metadata, drawn in white.
          logo=$(curl -fsSL https://raw.githubusercontent.com/leanprover/vscode-lean4/7a1bb55441807380aa710fd39141971dc532298b/vscode-lean4/images/lean_logo.svg \
            | tr '\n\t' '  ' | sed -e 's/<?xml[^>]*>//' -e 's/<metadata.*<\/metadata>//' -e 's/<sodipodi:namedview[^>]*>//' \
              -e 's/#000000/#ffffff/g' -e 's/#0000ff/#ffffff/g' -e 's/  */ /g')
          badge() {
            jq -n --arg l "$2" --arg m "$3" --arg c "$4" --arg logo "${5:-}" \
              '{schemaVersion: 1, label: $l, message: $m, color: $c, style: "flat"} + (if $logo == "" then {} else {logoSvg: $logo} end)' > "out/$1.json"
            echo "$2: $3 ($4)"
          }
          hyps=$(fact lean hypotheses) axioms=$(fact lean axioms) sorry=$(fact lean sorryAx)
          if [ "$(result lean)" = success ] && [ "$(result scan)" = success ] && [ "$sorry" = false ] && [ -n "$hyps" ]; then
            if [ "$hyps" -eq 0 ]; then badge lean "Lean Proved" "0 sorry · $axioms axioms" brightgreen "$logo"
            else badge lean "Lean Proved" "from $hyps hypotheses" orange "$logo"; fi
          else
            badge lean "Lean Proved" failed red "$logo"
          fi
          if [ "$(result comparator)" = success ]; then
            # The kernels of the two configs (config.json, config-recurrent.json), when they name the same.
            k=$(jq -rs 'map([.enable_nanoda // false, .lean_kernel != false] | map(tostring) | join(" ")) | unique | if length == 1 then .[0] else "mixed" end' config.json config-recurrent.json)
            case $k in "true true") m="statement checked · 2 kernels" ;; "true false") m="statement checked · nanoda" ;; mixed) m="statements checked" ;; *) m="statement checked · Lean kernel" ;; esac
            badge comparator "Lean Comparator" "$m" brightgreen
          else
            badge comparator "Lean Comparator" failed red
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | jq -s --arg re "$NOT_COMPUTATION" '[.[].jobs[] | select((.name | test($re)) | not)]' > jobs.json
          n=$(jq length jobs.json) k=$(jq 'map(select(.conclusion == "success")) | length' jobs.json)
          jq -r '.[] | "\(.name): \(.conclusion)"' jobs.json
          if [ "$n" -gt 0 ] && [ "$k" -eq "$n" ]; then c=brightgreen; else c=red; fi
          badge certificates "Computation Certificates" "$k/$n reproduced" "$c"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '<!doctype html>\n<meta charset="utf-8">\n<title>Run %s</title>\n<meta http-equiv="refresh" content="0; url=%s">\n<a href="%s">%s</a>\n' \
            "$GITHUB_RUN_ID" "$run" "$run" "$run" > out/run.html
          touch out/.nojekyll
      - name: Commit to the branch badges
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          url="https://github.com/$GITHUB_REPOSITORY.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --global "http.https://github.com/.extraheader" "$auth"
          git clone -q --depth 1 --branch badges "$url" b 2> /dev/null || { git init -q -b badges b && git -C b remote add origin "$url"; }
          cp -a out/. b/
          cd b
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.json run.html .nojekyll
          git diff --cached --quiet && { echo "badges unchanged"; exit 0; }
          git commit -qm "Badges of run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -q origin badges
